<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Music</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #090909;
            --sidebar: #0f0f0f;
            --card: #151515;
            --card-hover: #1d1d1d;
            --border: #252525;
            --text: #ffffff;
            --muted: #999999;
            --accent: #1ed760;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =========================
           LAYOUT
        ========================= */

        .app {
            display: flex;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 240px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            padding: 28px 18px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 100px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 40px;
            padding: 0 12px;
        }

        .nav-title {
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0 12px;
            margin-bottom: 12px;
        }

        .nav-item {
            width: 100%;
            border: none;
            background: transparent;
            color: #bdbdbd;
            text-align: left;
            padding: 12px;
            border-radius: 7px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: 0.2s;
        }

        .nav-item:hover {
            background: #1a1a1a;
            color: white;
        }

        .nav-item.active {
            background: #1b1b1b;
            color: white;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 35px 45px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            gap: 20px;
        }

        .heading h1 {
            font-size: 32px;
            margin-bottom: 7px;
        }

        .heading p {
            color: var(--muted);
            font-size: 14px;
        }

        /* =========================
           SEARCH
        ========================= */

        .search {
            width: 300px;
            position: relative;
        }

        .search input {
            width: 100%;
            background: #171717;
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 12px 18px;
            color: white;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .search input:focus {
            border-color: #444;
            background: #1b1b1b;
        }

        /* =========================
           SONGS
        ========================= */

        .section-title {
            font-size: 21px;
            margin-bottom: 18px;
        }

        .songs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 14px;
        }

        .song-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 17px;
            transition: 0.2s;
            position: relative;
        }

        .song-card:hover {
            background: var(--card-hover);
            transform: translateY(-2px);
        }

        .song-icon {
            width: 100%;
            height: 150px;
            border-radius: 7px;
            background:
                linear-gradient(135deg, #242424, #101010);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin-bottom: 15px;
        }

        .song-title {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            color: var(--muted);
            font-size: 13px;
            margin-top: 6px;
        }

        .song-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }

        .play-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: black;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        .play-button:hover {
            transform: scale(1.08);
        }

        .like-button {
            border: none;
            background: transparent;
            color: #777;
            font-size: 21px;
            cursor: pointer;
            transition: 0.2s;
        }

        .like-button:hover {
            color: white;
        }

        .like-button.liked {
            color: var(--accent);
        }

        .empty {
            color: var(--muted);
            padding: 40px 0;
            text-align: center;
        }

        /* =========================
           PLAYER
        ========================= */

        .player {
            height: 100px;
            background: rgba(15, 15, 15, 0.97);
            border-top: 1px solid var(--border);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 30px;
            backdrop-filter: blur(15px);
        }

        .now-playing {
            width: 250px;
            min-width: 250px;
        }

        .now-playing-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-playing-artist {
            color: var(--muted);
            font-size: 12px;
            margin-top: 5px;
        }

        .controls-area {
            flex: 1;
            max-width: 700px;
            margin: auto;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;
            margin-bottom: 9px;
        }

        .control {
            background: transparent;
            border: none;
            color: #bbb;
            cursor: pointer;
            font-size: 17px;
            transition: 0.2s;
        }

        .control:hover {
            color: white;
        }

        .main-play {
            width: 38px;
            height: 38px;
            background: white;
            color: black;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        .main-play:hover {
            transform: scale(1.06);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .time {
            color: var(--muted);
            font-size: 10px;
            width: 35px;
        }

        .time:last-child {
            text-align: right;
        }

        .progress {
            flex: 1;
            height: 4px;
            appearance: none;
            background: #444;
            border-radius: 5px;
            cursor: pointer;
        }

        .progress::-webkit-slider-thumb {
            appearance: none;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
        }

        .volume-area {
            width: 180px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume {
            flex: 1;
            height: 4px;
            appearance: none;
            background: #444;
            border-radius: 5px;
            cursor: pointer;
        }

        .volume::-webkit-slider-thumb {
            appearance: none;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .sidebar {
                display: none;
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 25px 18px 120px;
            }

            .topbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search {
                width: 100%;
            }

            .songs {
                grid-template-columns: repeat(2, 1fr);
            }

            .song-icon {
                height: 120px;
            }

            .player {
                height: 90px;
                padding: 10px 15px;
                gap: 10px;
            }

            .now-playing {
                width: 120px;
                min-width: 120px;
            }

            .volume-area {
                display: none;
            }

            .controls {
                gap: 12px;
            }
        }

        @media (max-width: 480px) {

            .songs {
                grid-template-columns: 1fr;
            }

            .song-icon {
                height: 140px;
            }

            .now-playing {
                width: 100px;
                min-width: 100px;
            }

            .controls {
                gap: 8px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            My Music
        </div>

        <div class="nav-title">
            Library
        </div>

        <button class="nav-item active" id="allSongsBtn">
            🎵 All Songs
        </button>

        <button class="nav-item" id="likedSongsBtn">
            ♥ Liked Songs
        </button>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <div class="topbar">

            <div class="heading">
                <h1 id="pageTitle">Your Library</h1>
                <p id="pageSubtitle">Your personal music collection</p>
            </div>

            <div class="search">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search songs or artists..."
                    autocomplete="off"
                >
            </div>

        </div>


        <h2 class="section-title">
            Songs
        </h2>

        <div class="songs" id="songsContainer"></div>

    </main>

</div>


<!-- PLAYER -->

<div class="player">

    <div class="now-playing">

        <div
            class="now-playing-title"
            id="nowPlayingTitle"
        >
            Nothing playing
        </div>

        <div
            class="now-playing-artist"
            id="nowPlayingArtist"
        >
            Select a song
        </div>

    </div>


    <div class="controls-area">

        <div class="controls">

            <button
                class="control"
                id="backwardButton"
                title="Back 10 seconds"
            >
                ↶
            </button>

            <button
                class="control"
                id="previousButton"
                title="Previous"
            >
                ⏮
            </button>

            <button
                class="main-play"
                id="playPauseButton"
                title="Play"
            >
                ▶
            </button>

            <button
                class="control"
                id="nextButton"
                title="Next"
            >
                ⏭
            </button>

            <button
                class="control"
                id="forwardButton"
                title="Forward 10 seconds"
            >
                ↷
            </button>

        </div>


        <div class="progress-container">

            <span
                class="time"
                id="currentTime"
            >
                0:00
            </span>

            <input
                type="range"
                class="progress"
                id="progress"
                min="0"
                max="100"
                value="0"
            >

            <span
                class="time"
                id="duration"
            >
                0:00
            </span>

        </div>

    </div>


    <div class="volume-area">

        <button
            class="control"
            id="muteButton"
            title="Mute"
        >
            🔊
        </button>

        <input
            type="range"
            class="volume"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >

    </div>

</div>


<!-- AUDIO ELEMENT -->

<audio id="audio"></audio>


<!-- YOUR SONG DATABASE -->

<script src="songs.js"></script>


<script>

    /* ==========================================
       ELEMENTS
    ========================================== */

    const audio = document.getElementById("audio");

    const songsContainer =
        document.getElementById("songsContainer");

    const searchInput =
        document.getElementById("searchInput");

    const playPauseButton =
        document.getElementById("playPauseButton");

    const previousButton =
        document.getElementById("previousButton");

    const nextButton =
        document.getElementById("nextButton");

    const forwardButton =
        document.getElementById("forwardButton");

    const backwardButton =
        document.getElementById("backwardButton");

    const progress =
        document.getElementById("progress");

    const currentTime =
        document.getElementById("currentTime");

    const duration =
        document.getElementById("duration");

    const volume =
        document.getElementById("volume");

    const muteButton =
        document.getElementById("muteButton");

    const nowPlayingTitle =
        document.getElementById("nowPlayingTitle");

    const nowPlayingArtist =
        document.getElementById("nowPlayingArtist");

    const allSongsBtn =
        document.getElementById("allSongsBtn");

    const likedSongsBtn =
        document.getElementById("likedSongsBtn");

    const pageTitle =
        document.getElementById("pageTitle");

    const pageSubtitle =
        document.getElementById("pageSubtitle");


    /* ==========================================
       STATE
    ========================================== */

    let currentSongIndex = -1;

    let isPlaying = false;

    let showingLikedSongs = false;

    let likedSongs =
        JSON.parse(localStorage.getItem("likedSongs") || "[]");


    /* ==========================================
       HELPERS
    ========================================== */

    function formatTime(seconds) {

        if (!Number.isFinite(seconds)) {
            return "0:00";
        }

        const minutes =
            Math.floor(seconds / 60);

        const secs =
            Math.floor(seconds % 60)
                .toString()
                .padStart(2, "0");

        return `${minutes}:${secs}`;
    }


    function isLiked(songId) {

        return likedSongs.includes(songId);

    }


    /* ==========================================
       RENDER SONGS
    ========================================== */

    function renderSongs(list = songs) {

        songsContainer.innerHTML = "";

        if (list.length === 0) {

            songsContainer.innerHTML = `
                <div class="empty">
                    No songs found.
                </div>
            `;

            return;
        }


        list.forEach(song => {

            const originalIndex =
                songs.findIndex(
                    item => item.id === song.id
                );


            const card =
                document.createElement("div");

            card.className = "song-card";


            card.innerHTML = `

                <div class="song-icon">
                    ♪
                </div>

                <div class="song-title">
                    ${escapeHTML(song.title)}
                </div>

                <div class="song-artist">
                    ${escapeHTML(song.artist)}
                </div>

                <div class="song-actions">

                    <button
                        class="play-button"
                        title="Play"
                        onclick="playSong(${originalIndex})"
                    >
                        ▶
                    </button>

                    <button
                        class="like-button ${isLiked(song.id) ? "liked" : ""}"
                        title="Like"
                        onclick="toggleLike('${song.id}')"
                    >
                        ${isLiked(song.id) ? "♥" : "♡"}
                    </button>

                </div>

            `;

            songsContainer.appendChild(card);

        });

    }


    /* ==========================================
       ESCAPE HTML
    ========================================== */

    function escapeHTML(value) {

        const div =
            document.createElement("div");

        div.textContent = value;

        return div.innerHTML;

    }


    /* ==========================================
       PLAY SONG
    ========================================== */

    function playSong(index) {

        if (!songs[index]) return;

        currentSongIndex = index;

        const song = songs[index];

        audio.src = song.file;

        nowPlayingTitle.textContent =
            song.title;

        nowPlayingArtist.textContent =
            song.artist;

        audio.play();

    }


    /* ==========================================
       PLAY / PAUSE
    ========================================== */

    playPauseButton.addEventListener(
        "click",
        () => {

            if (currentSongIndex === -1) {

                if (songs.length > 0) {
                    playSong(0);
                }

                return;
            }


            if (audio.paused) {

                audio.play();

            } else {

                audio.pause();

            }

        }
    );


    /* ==========================================
       AUDIO PLAY
    ========================================== */

    audio.addEventListener(
        "play",
        () => {

            isPlaying = true;

            playPauseButton.textContent =
                "Ⅱ";

        }
    );


    /* ==========================================
       AUDIO PAUSE
    ========================================== */

    audio.addEventListener(
        "pause",
        () => {

            isPlaying = false;

            playPauseButton.textContent =
                "▶";

        }
    );


    /* ==========================================
       PROGRESS
    ========================================== */

    audio.addEventListener(
        "loadedmetadata",
        () => {

            duration.textContent =
                formatTime(audio.duration);

        }
    );


    audio.addEventListener(
        "timeupdate",
        () => {

            if (!audio.duration) return;

            progress.value =
                (audio.currentTime /
                audio.duration) * 100;

            currentTime.textContent =
                formatTime(audio.currentTime);

        }
    );


    progress.addEventListener(
        "input",
        () => {

            if (!audio.duration) return;

            audio.currentTime =
                (progress.value / 100) *
                audio.duration;

        }
    );


    /* ==========================================
       NEXT SONG
    ========================================== */

    nextButton.addEventListener(
        "click",
        nextSong
    );


    function nextSong() {

        if (songs.length === 0) return;

        let nextIndex =
            currentSongIndex + 1;

        if (nextIndex >= songs.length) {
            nextIndex = 0;
        }

        playSong(nextIndex);

    }


    /* ==========================================
       PREVIOUS SONG
    ========================================== */

    previousButton.addEventListener(
        "click",
        previousSong
    );


    function previousSong() {

        if (songs.length === 0) return;

        let previousIndex =
            currentSongIndex - 1;

        if (previousIndex < 0) {
            previousIndex = songs.length - 1;
        }

        playSong(previousIndex);

    }


    /* ==========================================
       FORWARD / BACKWARD
    ========================================== */

    forwardButton.addEventListener(
        "click",
        () => {

            audio.currentTime =
                Math.min(
                    audio.currentTime + 10,
                    audio.duration || Infinity
                );

        }
    );


    backwardButton.addEventListener(
        "click",
        () => {

            audio.currentTime =
                Math.max(
                    audio.currentTime - 10,
                    0
                );

        }
    );


    /* ==========================================
       AUTOPLAY NEXT
    ========================================== */

    audio.addEventListener(
        "ended",
        () => {

            nextSong();

        }
    );


    /* ==========================================
       VOLUME
    ========================================== */

    const savedVolume =
        localStorage.getItem("volume");

    if (savedVolume !== null) {

        volume.value =
            savedVolume;

        audio.volume =
            Number(savedVolume);

    } else {

        audio.volume = 1;

    }


    volume.addEventListener(
        "input",
        () => {

            audio.volume =
                Number(volume.value);

            localStorage.setItem(
                "volume",
                volume.value
            );

            updateMuteIcon();

        }
    );


    /* ==========================================
       MUTE
    ========================================== */

    muteButton.addEventListener(
        "click",
        () => {

            audio.muted =
                !audio.muted;

            updateMuteIcon();

        }
    );


    function updateMuteIcon() {

        if (
            audio.muted ||
            audio.volume === 0
        ) {

            muteButton.textContent = "🔇";

        } else {

            muteButton.textContent = "🔊";

        }

    }


    /* ==========================================
       LIKE SONG
    ========================================== */

    function toggleLike(songId) {

        if (isLiked(songId)) {

            likedSongs =
                likedSongs.filter(
                    id => id !== songId
                );

        } else {

            likedSongs.push(songId);

        }


        localStorage.setItem(
            "likedSongs",
            JSON.stringify(likedSongs)
        );


        if (showingLikedSongs) {

            renderSongs(
                songs.filter(
                    song => isLiked(song.id)
                )
            );

        } else {

            renderSongs();

        }

    }


    /* ==========================================
       SEARCH
    ========================================== */

    searchInput.addEventListener(
        "input",
        () => {

            const query =
                searchInput.value
                    .trim()
                    .toLowerCase();


            let baseList =
                showingLikedSongs
                    ? songs.filter(
                        song => isLiked(song.id)
                    )
                    : songs;


            if (!query) {

                renderSongs(baseList);

                return;

            }


            const filtered =
                baseList.filter(song =>

                    song.title
                        .toLowerCase()
                        .includes(query)

                    ||

                    song.artist
                        .toLowerCase()
                        .includes(query)

                );


            renderSongs(filtered);

        }
    );


    /* ==========================================
       ALL SONGS
    ========================================== */

    allSongsBtn.addEventListener(
        "click",
        () => {

            showingLikedSongs = false;

            allSongsBtn.classList.add("active");

            likedSongsBtn.classList.remove("active");

            pageTitle.textContent =
                "Your Library";

            pageSubtitle.textContent =
                "Your personal music collection";

            searchInput.value = "";

            renderSongs();

        }
    );


    /* ==========================================
       LIKED SONGS
    ========================================== */

    likedSongsBtn.addEventListener(
        "click",
        () => {

            showingLikedSongs = true;

            likedSongsBtn.classList.add("active");

            allSongsBtn.classList.remove("active");

            pageTitle.textContent =
                "Liked Songs";

            pageSubtitle.textContent =
                "Songs you've saved";

            searchInput.value = "";

            renderSongs(
                songs.filter(
                    song => isLiked(song.id)
                )
            );

        }
    );


    /* ==========================================
       KEYBOARD CONTROLS
    ========================================== */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.target.tagName === "INPUT"
            ) {
                return;
            }


            if (event.code === "Space") {

                event.preventDefault();

                playPauseButton.click();

            }


            if (event.code === "ArrowRight") {

                audio.currentTime =
                    Math.min(
                        audio.currentTime + 5,
                        audio.duration || Infinity
                    );

            }


            if (event.code === "ArrowLeft") {

                audio.currentTime =
                    Math.max(
                        audio.currentTime - 5,
                        0
                    );

            }

        }
    );


    /* ==========================================
       INITIAL RENDER
    ========================================== */

    renderSongs();

</script>

</body>
</html><!DOCTYPE html>

            border: none;
            background: transparent;
            color: #bdbdbd;
            text-align: left;
            padding: 12px;
            border-radius: 7px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: 0.2s;
        }

        .nav-item:hover {
            background: #1a1a1a;
            color: white;
        }

        .nav-item.active {
            background: #1b1b1b;
            color: white;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 35px 45px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            gap: 20px;
        }

        .heading h1 {
            font-size: 32px;
            margin-bottom: 7px;
        }

        .heading p {
            color: var(--muted);
            font-size: 14px;
        }

        /* =========================
           SEARCH
        ========================= */

        .search {
            width: 300px;
            position: relative;
        }

        .search input {
            width: 100%;
            background: #171717;
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 12px 18px;
            color: white;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .search input:focus {
            border-color: #444;
            background: #1b1b1b;
        }

        /* =========================
           SONGS
        ========================= */

        .section-title {
            font-size: 21px;
            margin-bottom: 18px;
        }

        .songs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 14px;
        }

        .song-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 17px;
            transition: 0.2s;
            position: relative;
        }

        .song-card:hover {
            background: var(--card-hover);
            transform: translateY(-2px);
        }

        .song-icon {
            width: 100%;
            height: 150px;
            border-radius: 7px;
            background:
                linear-gradient(135deg, #242424, #101010);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin-bottom: 15px;
        }

        .song-title {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            color: var(--muted);
            font-size: 13px;
            margin-top: 6px;
        }

        .song-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }

        .play-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: black;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        .play-button:hover {
            transform: scale(1.08);
        }

        .like-button {
            border: none;
            background: transparent;
            color: #777;
            font-size: 21px;
            cursor: pointer;
            transition: 0.2s;
        }

        .like-button:hover {
            color: white;
        }

        .like-button.liked {
            color: var(--accent);
        }

        .empty {
            color: var(--muted);
            padding: 40px 0;
            text-align: center;
        }

        /* =========================
           PLAYER
        ========================= */

        .player {
            height: 100px;
            background: rgba(15, 15, 15, 0.97);
            border-top: 1px solid var(--border);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 30px;
            backdrop-filter: blur(15px);
        }

        .now-playing {
            width: 250px;
            min-width: 250px;
        }

        .now-playing-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-playing-artist {
            color: var(--muted);
            font-size: 12px;
            margin-top: 5px;
        }

        .controls-area {
            flex: 1;
            max-width: 700px;
            margin: auto;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;
            margin-bottom: 9px;
        }

        .control {
            background: transparent;
            border: none;
            color: #bbb;
            cursor: pointer;
            font-size: 17px;
            transition: 0.2s;
        }

        .control:hover {
            color: white;
        }

        .main-play {
            width: 38px;
            height: 38px;
            background: white;
            color: black;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        .main-play:hover {
            transform: scale(1.06);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .time {
            color: var(--muted);
            font-size: 10px;
            width: 35px;
        }

        .time:last-child {
            text-align: right;
        }

        .progress {
            flex: 1;
            height: 4px;
            appearance: none;
            background: #444;
            border-radius: 5px;
            cursor: pointer;
        }

        .progress::-webkit-slider-thumb {
            appearance: none;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
        }

        .volume-area {
            width: 180px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume {
            flex: 1;
            height: 4px;
            appearance: none;
            background: #444;
            border-radius: 5px;
            cursor: pointer;
        }

        .volume::-webkit-slider-thumb {
            appearance: none;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .sidebar {
                display: none;
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 25px 18px 120px;
            }

            .topbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search {
                width: 100%;
            }

            .songs {
                grid-template-columns: repeat(2, 1fr);
            }

            .song-icon {
                height: 120px;
            }

            .player {
                height: 90px;
                padding: 10px 15px;
                gap: 10px;
            }

            .now-playing {
                width: 120px;
                min-width: 120px;
            }

            .volume-area {
                display: none;
            }

            .controls {
                gap: 12px;
            }
        }

        @media (max-width: 480px) {

            .songs {
                grid-template-columns: 1fr;
            }

            .song-icon {
                height: 140px;
            }

            .now-playing {
                width: 100px;
                min-width: 100px;
            }

            .controls {
                gap: 8px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            My Music
        </div>

        <div class="nav-title">
            Library
        </div>

        <button class="nav-item active" id="allSongsBtn">
            🎵 All Songs
        </button>

        <button class="nav-item" id="likedSongsBtn">
            ♥ Liked Songs
        </button>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <div class="topbar">

            <div class="heading">
                <h1 id="pageTitle">Your Library</h1>
                <p id="pageSubtitle">Your personal music collection</p>
            </div>

            <div class="search">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search songs or artists..."
                    autocomplete="off"
                >
            </div>

        </div>


        <h2 class="section-title">
            Songs
        </h2>

        <div class="songs" id="songsContainer"></div>

    </main>

</div>


<!-- PLAYER -->

<div class="player">

    <div class="now-playing">

        <div
            class="now-playing-title"
            id="nowPlayingTitle"
        >
            Nothing playing
        </div>

        <div
            class="now-playing-artist"
            id="nowPlayingArtist"
        >
            Select a song
        </div>

    </div>


    <div class="controls-area">

        <div class="controls">

            <button
                class="control"
                id="backwardButton"
                title="Back 10 seconds"
            >
                ↶
            </button>

            <button
                class="control"
                id="previousButton"
                title="Previous"
            >
                ⏮
            </button>

            <button
                class="main-play"
                id="playPauseButton"
                title="Play"
            >
                ▶
            </button>

            <button
                class="control"
                id="nextButton"
                title="Next"
            >
                ⏭
            </button>

            <button
                class="control"
                id="forwardButton"
                title="Forward 10 seconds"
            >
                ↷
            </button>

        </div>


        <div class="progress-container">

            <span
                class="time"
                id="currentTime"
            >
                0:00
            </span>

            <input
                type="range"
                class="progress"
                id="progress"
                min="0"
                max="100"
                value="0"
            >

            <span
                class="time"
                id="duration"
            >
                0:00
            </span>

        </div>

    </div>


    <div class="volume-area">

        <button
            class="control"
            id="muteButton"
            title="Mute"
        >
            🔊
        </button>

        <input
            type="range"
            class="volume"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >

    </div>

</div>


<!-- AUDIO ELEMENT -->

<audio id="audio"></audio>


<!-- YOUR SONG DATABASE -->

<script src="songs.js"></script>


<script>

    /* ==========================================
       ELEMENTS
    ========================================== */

    const audio = document.getElementById("audio");

    const songsContainer =
        document.getElementById("songsContainer");

    const searchInput =
        document.getElementById("searchInput");

    const playPauseButton =
        document.getElementById("playPauseButton");

    const previousButton =
        document.getElementById("previousButton");

    const nextButton =
        document.getElementById("nextButton");

    const forwardButton =
        document.getElementById("forwardButton");

    const backwardButton =
        document.getElementById("backwardButton");

    const progress =
        document.getElementById("progress");

    const currentTime =
        document.getElementById("currentTime");

    const duration =
        document.getElementById("duration");

    const volume =
        document.getElementById("volume");

    const muteButton =
        document.getElementById("muteButton");

    const nowPlayingTitle =
        document.getElementById("nowPlayingTitle");

    const nowPlayingArtist =
        document.getElementById("nowPlayingArtist");

    const allSongsBtn =
        document.getElementById("allSongsBtn");

    const likedSongsBtn =
        document.getElementById("likedSongsBtn");

    const pageTitle =
        document.getElementById("pageTitle");

    const pageSubtitle =
        document.getElementById("pageSubtitle");


    /* ==========================================
       STATE
    ========================================== */

    let currentSongIndex = -1;

    let isPlaying = false;

    let showingLikedSongs = false;

    let likedSongs =
        JSON.parse(localStorage.getItem("likedSongs") || "[]");


    /* ==========================================
       HELPERS
    ========================================== */

    function formatTime(seconds) {

        if (!Number.isFinite(seconds)) {
            return "0:00";
        }

        const minutes =
            Math.floor(seconds / 60);

        const secs =
            Math.floor(seconds % 60)
                .toString()
                .padStart(2, "0");

        return `${minutes}:${secs}`;
    }


    function isLiked(songId) {

        return likedSongs.includes(songId);

    }


    /* ==========================================
       RENDER SONGS
    ========================================== */

    function renderSongs(list = songs) {

        songsContainer.innerHTML = "";

        if (list.length === 0) {

            songsContainer.innerHTML = `
                <div class="empty">
                    No songs found.
                </div>
            `;

            return;
        }


        list.forEach(song => {

            const originalIndex =
                songs.findIndex(
                    item => item.id === song.id
                );


            const card =
                document.createElement("div");

            card.className = "song-card";


            card.innerHTML = `

                <div class="song-icon">
                    ♪
                </div>

                <div class="song-title">
                    ${escapeHTML(song.title)}
                </div>

                <div class="song-artist">
                    ${escapeHTML(song.artist)}
                </div>

                <div class="song-actions">

                    <button
                        class="play-button"
                        title="Play"
                        onclick="playSong(${originalIndex})"
                    >
                        ▶
                    </button>

                    <button
                        class="like-button ${isLiked(song.id) ? "liked" : ""}"
                        title="Like"
                        onclick="toggleLike('${song.id}')"
                    >
                        ${isLiked(song.id) ? "♥" : "♡"}
                    </button>

                </div>

            `;

            songsContainer.appendChild(card);

        });

    }


    /* ==========================================
       ESCAPE HTML
    ========================================== */

    function escapeHTML(value) {

        const div =
            document.createElement("div");

        div.textContent = value;

        return div.innerHTML;

    }


    /* ==========================================
       PLAY SONG
    ========================================== */

    function playSong(index) {

        if (!songs[index]) return;

        currentSongIndex = index;

        const song = songs[index];

        audio.src = song.file;

        nowPlayingTitle.textContent =
            song.title;

        nowPlayingArtist.textContent =
            song.artist;

        audio.play();

    }


    /* ==========================================
       PLAY / PAUSE
    ========================================== */

    playPauseButton.addEventListener(
        "click",
        () => {

            if (currentSongIndex === -1) {

                if (songs.length > 0) {
                    playSong(0);
                }

                return;
            }


            if (audio.paused) {

                audio.play();

            } else {

                audio.pause();

            }

        }
    );


    /* ==========================================
       AUDIO PLAY
    ========================================== */

    audio.addEventListener(
        "play",
        () => {

            isPlaying = true;

            playPauseButton.textContent =
                "Ⅱ";

        }
    );


    /* ==========================================
       AUDIO PAUSE
    ========================================== */

    audio.addEventListener(
        "pause",
        () => {

            isPlaying = false;

            playPauseButton.textContent =
                "▶";

        }
    );


    /* ==========================================
       PROGRESS
    ========================================== */

    audio.addEventListener(
        "loadedmetadata",
        () => {

            duration.textContent =
                formatTime(audio.duration);

        }
    );


    audio.addEventListener(
        "timeupdate",
        () => {

            if (!audio.duration) return;

            progress.value =
                (audio.currentTime /
                audio.duration) * 100;

            currentTime.textContent =
                formatTime(audio.currentTime);

        }
    );


    progress.addEventListener(
        "input",
        () => {

            if (!audio.duration) return;

            audio.currentTime =
                (progress.value / 100) *
                audio.duration;

        }
    );


    /* ==========================================
       NEXT SONG
    ========================================== */

    nextButton.addEventListener(
        "click",
        nextSong
    );


    function nextSong() {

        if (songs.length === 0) return;

        let nextIndex =
            currentSongIndex + 1;

        if (nextIndex >= songs.length) {
            nextIndex = 0;
        }

        playSong(nextIndex);

    }


    /* ==========================================
       PREVIOUS SONG
    ========================================== */

    previousButton.addEventListener(
        "click",
        previousSong
    );


    function previousSong() {

        if (songs.length === 0) return;

        let previousIndex =
            currentSongIndex - 1;

        if (previousIndex < 0) {
            previousIndex = songs.length - 1;
        }

        playSong(previousIndex);

    }


    /* ==========================================
       FORWARD / BACKWARD
    ========================================== */

    forwardButton.addEventListener(
        "click",
        () => {

            audio.currentTime =
                Math.min(
                    audio.currentTime + 10,
                    audio.duration || Infinity
                );

        }
    );


    backwardButton.addEventListener(
        "click",
        () => {

            audio.currentTime =
                Math.max(
                    audio.currentTime - 10,
                    0
                );

        }
    );


    /* ==========================================
       AUTOPLAY NEXT
    ========================================== */

    audio.addEventListener(
        "ended",
        () => {

            nextSong();

        }
    );


    /* ==========================================
       VOLUME
    ========================================== */

    const savedVolume =
        localStorage.getItem("volume");

    if (savedVolume !== null) {

        volume.value =
            savedVolume;

        audio.volume =
            Number(savedVolume);

    } else {

        audio.volume = 1;

    }


    volume.addEventListener(
        "input",
        () => {

            audio.volume =
                Number(volume.value);

            localStorage.setItem(
                "volume",
                volume.value
            );

            updateMuteIcon();

        }
    );


    /* ==========================================
       MUTE
    ========================================== */

    muteButton.addEventListener(
        "click",
        () => {

            audio.muted =
                !audio.muted;

            updateMuteIcon();

        }
    );


    function updateMuteIcon() {

        if (
            audio.muted ||
            audio.volume === 0
        ) {

            muteButton.textContent = "🔇";

        } else {

            muteButton.textContent = "🔊";

        }

    }


    /* ==========================================
       LIKE SONG
    ========================================== */

    function toggleLike(songId) {

        if (isLiked(songId)) {

            likedSongs =
                likedSongs.filter(
                    id => id !== songId
                );

        } else {

            likedSongs.push(songId);

        }


        localStorage.setItem(
            "likedSongs",
            JSON.stringify(likedSongs)
        );


        if (showingLikedSongs) {

            renderSongs(
                songs.filter(
                    song => isLiked(song.id)
                )
            );

        } else {

            renderSongs();

        }

    }


    /* ==========================================
       SEARCH
    ========================================== */

    searchInput.addEventListener(
        "input",
        () => {

            const query =
                searchInput.value
                    .trim()
                    .toLowerCase();


            let baseList =
                showingLikedSongs
                    ? songs.filter(
                        song => isLiked(song.id)
                    )
                    : songs;


            if (!query) {

                renderSongs(baseList);

                return;

            }


            const filtered =
                baseList.filter(song =>

                    song.title
                        .toLowerCase()
                        .includes(query)

                    ||

                    song.artist
                        .toLowerCase()
                        .includes(query)

                );


            renderSongs(filtered);

        }
    );


    /* ==========================================
       ALL SONGS
    ========================================== */

    allSongsBtn.addEventListener(
        "click",
        () => {

            showingLikedSongs = false;

            allSongsBtn.classList.add("active");

            likedSongsBtn.classList.remove("active");

            pageTitle.textContent =
                "Your Library";

            pageSubtitle.textContent =
                "Your personal music collection";

            searchInput.value = "";

            renderSongs();

        }
    );


    /* ==========================================
       LIKED SONGS
    ========================================== */

    likedSongsBtn.addEventListener(
        "click",
        () => {

            showingLikedSongs = true;

            likedSongsBtn.classList.add("active");

            allSongsBtn.classList.remove("active");

            pageTitle.textContent =
                "Liked Songs";

            pageSubtitle.textContent =
                "Songs you've saved";

            searchInput.value = "";

            renderSongs(
                songs.filter(
                    song => isLiked(song.id)
                )
            );

        }
    );


    /* ==========================================
       KEYBOARD CONTROLS
    ========================================== */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.target.tagName === "INPUT"
            ) {
                return;
            }


            if (event.code === "Space") {

                event.preventDefault();

                playPauseButton.click();

            }


            if (event.code === "ArrowRight") {

                audio.currentTime =
                    Math.min(
                        audio.currentTime + 5,
                        audio.duration || Infinity
                    );

            }


            if (event.code === "ArrowLeft") {

                audio.currentTime =
                    Math.max(
                        audio.currentTime - 5,
                        0
                    );

            }

        }
    );


    /* ==========================================
       INITIAL RENDER
    ========================================== */

    renderSongs();

</script>

</body>
</html>
