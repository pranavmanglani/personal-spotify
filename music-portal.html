<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Portal</title>
<style>
*{box-sizing:border-box}
:root{--bg:#05070b;--panel:#0a0f17;--line:#172232;--cyan:#00eaff;--text:#e8f0f7;--muted:#718096;--danger:#ff4567}
body{
  margin:0;min-height:100vh;background:
  radial-gradient(circle at 50% -10%,rgba(0,234,255,.10),transparent 35%),
  linear-gradient(135deg,#030509,#070b12 55%,#030509);
  color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:40px 40px;
}
.wrap{width:min(900px,92%);margin:auto;padding:55px 0;position:relative}
.logo{font:700 13px monospace;letter-spacing:4px;color:var(--cyan);margin-bottom:30px}
.card{background:rgba(10,15,23,.92);border:1px solid var(--line);box-shadow:0 0 40px rgba(0,234,255,.045)}
.login{max-width:430px;margin:8vh auto 0;padding:32px}
h1{margin:0 0 8px;font-size:28px}
.sub{color:var(--muted);font-size:13px;margin-bottom:28px}
label{display:block;color:#91a1b5;font:11px monospace;letter-spacing:1.5px;text-transform:uppercase;margin:18px 0 8px}
input{
 width:100%;padding:13px 14px;background:#060a10;border:1px solid #1b293a;
 color:white;outline:none;border-radius:2px;font-size:14px
}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(0,234,255,.12)}
button{
 border:1px solid var(--cyan);background:rgba(0,234,255,.07);color:var(--cyan);
 padding:12px 18px;cursor:pointer;font-weight:700;letter-spacing:1px
}
button:hover{background:rgba(0,234,255,.14)}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{width:100%;margin-top:24px}
.error{color:var(--danger);font:12px monospace;margin-top:14px;min-height:16px}
.hidden{display:none!important}
.header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}
.user{color:var(--muted);font:12px monospace}
.user strong{color:var(--cyan)}
.song{
 display:flex;align-items:center;gap:16px;padding:17px 18px;border-top:1px solid var(--line)
}
.song:first-child{border-top:0}
.icon{width:42px;height:42px;border:1px solid #203143;display:grid;place-items:center;color:var(--cyan);font-size:17px}
.info{flex:1;min-width:0}
.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:12px;color:var(--muted);margin-top:4px}
.play{padding:9px 13px;font-size:11px}
.status{font:11px monospace;color:var(--muted);margin:18px 0}
.empty{text-align:center;padding:45px;color:var(--muted);font:12px monospace}
.player{position:sticky;bottom:15px;margin-top:20px;padding:16px;background:rgba(5,8,13,.96);border:1px solid var(--line)}
.now{font-size:13px;margin-bottom:10px}
audio{width:100%}
.badge{font:10px monospace;color:#607086;letter-spacing:1px}
</style>
</head>
<body>
<div class="wrap">

  <section id="loginView" class="login card">
    <div class="logo">PM // MUSIC_PORTAL</div>
    <h1>Access Portal</h1>
    <div class="sub">Authenticate to load your assigned music.</div>

    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button id="loginBtn" class="primary" type="submit">AUTHENTICATE</button>
      <div id="loginError" class="error"></div>
    </form>
  </section>

  <section id="musicView" class="hidden">
    <div class="header">
      <div>
        <div class="logo">PM // MUSIC_PORTAL</div>
        <div class="user">SIGNED IN AS <strong id="userName">—</strong></div>
      </div>
      <button id="logoutBtn">LOGOUT</button>
    </div>

    <div class="card">
      <div style="padding:20px 18px;border-bottom:1px solid var(--line)">
        <strong>YOUR MUSIC</strong>
        <div id="status" class="status">Loading assigned songs...</div>
      </div>
      <div id="songList"></div>
    </div>

    <div id="playerBox" class="player hidden">
      <div class="now">NOW PLAYING: <strong id="nowPlaying">—</strong></div>
      <audio id="audio" controls></audio>
    </div>
  </section>

</div>

<script>
const LOGIN_URL = "https://lzwchczsbbzspakwuafx.supabase.co/functions/v1/portal-login";
const SONGS_URL = "https://lzwchczsbbzspakwuafx.supabase.co/functions/v1/get-user-songs";
const LOGOUT_URL = "https://lzwchczsbbzspakwuafx.supabase.co/functions/v1/logout";

let sessionToken = sessionStorage.getItem("music_session");
let currentSongs = [];

const $ = id => document.getElementById(id);

function showLogin(message = "") {
  $("loginView").classList.remove("hidden");
  $("musicView").classList.add("hidden");
  $("loginError").textContent = message;
}

function showMusic(user) {
  $("loginView").classList.add("hidden");
  $("musicView").classList.remove("hidden");
  $("userName").textContent = user?.name || user?.username || "USER";
}

async function login(username, password) {
  const response = await fetch(LOGIN_URL, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({username, password})
  });

  const result = await response.json();

  if (!response.ok || !result.success) {
    throw new Error(result.error || "Login failed");
  }

  sessionToken = result.token;
  sessionStorage.setItem("music_session", sessionToken);

  return result;
}

async function loadSongs() {
  if (!sessionToken) {
    showLogin();
    return;
  }

  $("status").textContent = "Loading assigned songs...";

  const response = await fetch(SONGS_URL, {
    method: "GET",
    headers: {
      "Authorization": `Bearer ${sessionToken}`
    }
  });

  const result = await response.json();

  if (response.status === 401) {
    sessionStorage.removeItem("music_session");
    sessionToken = null;
    showLogin(result.error || "Session expired");
    return;
  }

  if (!response.ok || !result.success) {
    throw new Error(result.error || "Could not load songs");
  }

  currentSongs = result.songs || [];
  renderSongs();

  $("status").textContent =
    `${currentSongs.length} assigned song${currentSongs.length === 1 ? "" : "s"} loaded`;
}

function renderSongs() {
  const list = $("songList");
  list.innerHTML = "";

  if (!currentSongs.length) {
    list.innerHTML = `<div class="empty">NO SONGS ASSIGNED TO THIS ACCOUNT</div>`;
    return;
  }

  currentSongs.forEach((song, index) => {
    const row = document.createElement("div");
    row.className = "song";

    row.innerHTML = `
      <div class="icon">♪</div>
      <div class="info">
        <div class="title"></div>
        <div class="artist"></div>
      </div>
      <button class="play" type="button">PLAY</button>
    `;

    row.querySelector(".title").textContent = song.title || "Untitled";
    row.querySelector(".artist").textContent = song.artist || "Unknown artist";

    row.querySelector(".play").addEventListener("click", () => playSong(index));
    list.appendChild(row);
  });
}

function playSong(index) {
  const song = currentSongs[index];
  if (!song?.url) return;

  $("playerBox").classList.remove("hidden");
  $("nowPlaying").textContent =
    `${song.title || "Untitled"}${song.artist ? " — " + song.artist : ""}`;

  $("audio").src = song.url;
  $("audio").play().catch(() => {});
}

async function logout() {
  if (sessionToken) {
    try {
      await fetch(LOGOUT_URL, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${sessionToken}`
        }
      });
    } catch (_) {}
  }

  sessionStorage.removeItem("music_session");
  sessionToken = null;
  currentSongs = [];
  $("audio").pause();
  $("audio").removeAttribute("src");
  $("playerBox").classList.add("hidden");
  $("songList").innerHTML = "";
  showLogin();
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();

  const username = $("username").value.trim();
  const password = $("password").value;

  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "AUTHENTICATING...";
  $("loginError").textContent = "";

  try {
    const result = await login(username, password);
    showMusic(result.user);
    await loadSongs();
  } catch (error) {
    showLogin(error.message);
  } finally {
    $("loginBtn").disabled = false;
    $("loginBtn").textContent = "AUTHENTICATE";
  }
});

$("logoutBtn").addEventListener("click", logout);

(async function init() {
  if (!sessionToken) {
    showLogin();
    return;
  }

  try {
    // The session token identifies the user; get-user-songs
    // currently doesn't return the user's name, so show a
    // generic signed-in state for restored sessions.
    showMusic({name: "SESSION"});
    await loadSongs();
  } catch (error) {
    sessionStorage.removeItem("music_session");
    sessionToken = null;
    showLogin(error.message);
  }
})();
</script>
</body>
</html>
